<form (ngSubmit)="onSubmit()">
<div><span style="font-size: 48px;"><label> Login </label></span>
    </div>
    <br>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" name="email" [(ngModel)]="email">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" name="password" [(ngModel)]="password">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  @if (error) {
  <div class="alert alert-danger">{{error }}</div>
}
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
